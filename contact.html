<main class="contact">

<h1>
📞 تواصل معنا
</h1>


<form
onsubmit="sendContact(event)">

<input
id="contactName"
type="text"
placeholder="الاسم بالكامل"
required>


<input
id="contactPhone"
type="tel"
placeholder="رقم الهاتف"
required>


<input
id="contactEmail"
type="email"
placeholder="البريد الإلكتروني">


<textarea
id="contactMessage"
placeholder="اكتب رسالتك هنا..."
required>
</textarea>


<button type="submit">

📱 إرسال عبر واتساب

</button>

</form>

</main>


<footer>

© 2026

<strong>
m/k-techno
</strong>

— جميع الحقوق محفوظة

</footer>


<script src="cart.js"></script>


<script>

function sendContact(event) {

event.preventDefault();


const name =
document.getElementById(
"contactName"
).value.trim();


const phone =
document.getElementById(
"contactPhone"
).value.trim();


const email =
document.getElementById(
"contactEmail"
).value.trim();


const message =
document.getElementById(
"contactMessage"
).value.trim();


const whatsappNumber =
"201017865201";


const text =

`📩 *رسالة جديدة إلى m/k-techno*

👤 الاسم:
${name}

📞 الهاتف:
${phone}

📧 البريد الإلكتروني:
${email || "غير مذكور"}

💬 الرسالة:
${message}`;


const url =
"https://wa.me/" +
whatsappNumber +
"?text=" +
encodeURIComponent(text);


window.open(
url,
"_blank"
);

}

</script>
